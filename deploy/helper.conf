# FSView root helper configuration (/etc/fsview/helper.conf)
# Owned by root. The web UI cannot change this file.
# Restart after changes: systemctl restart fsview-helper

socket = /run/fsview/helper.sock
# Only this user may talk to the helper (checked with SO_PEERCRED).
client_user = fsview
audit_log = /var/log/fsview/audit.log
# Timestamped copies of /etc/fstab made before every change (newest 50 kept).
backup_dir = /var/lib/fsview-helper/backups

# Master switch for every write operation (SMART self-tests, fstab edits,
# mount/unmount, format, check/repair, pools, locate LEDs).
# Read-only by default.
writes_enabled = false

# Pools page -> Pool health -> "Repair branch" (unmount, fsck, remount).
# Commands run as root before the repair, to stop programs that use the
# pool, and after it, e.g. to restart an LXC container: a container keeps
# the old mergerfs instance in its mount namespace until it restarts.
# ';' separates commands; there is no shell (no quotes, pipes or variables).
# Failures of these commands are logged and ignored.
# repair_stop = pct exec 200 -- docker stop encore ; pct exec 200 -- docker stop qbittorrent
# repair_post = pct reboot 200
repair_stop =
repair_post =

# Treat loop devices as disks (testing only).
include_loop_devices = false
