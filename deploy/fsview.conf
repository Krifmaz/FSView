# FSView web server configuration (/etc/fsview/fsview.conf)
# Restart after changes: systemctl restart fsview

# Addresses to listen on. "auto" = the IPv4 address of the interface with the
# default route (e.g. vmbr0). FSView never listens on 0.0.0.0 unless you put
# it here explicitly. Comma-separated; entries may include a port.
listen = auto
port = 9200

# Clients allowed to connect (comma-separated CIDRs or IPs). "auto" = the LAN
# subnet of the listen interface plus Tailscale's 100.64.0.0/10.
# Everything else is dropped before any HTTP is spoken.
allow = auto

# Optional HTTPS. Set both to enable (e.g. a cert from `tailscale cert`).
tls_cert =
tls_key =

data_dir = /var/lib/fsview
helper_socket = /run/fsview/helper.sock

# SMART polling interval. Polling uses `smartctl -n standby`, so sleeping
# disks are never woken by FSView.
smart_poll = 30m
journal_poll = 3s
