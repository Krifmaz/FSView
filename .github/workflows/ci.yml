name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        run: cd web && npm ci && npm run build
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build release binary
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: fsview-linux-amd64
          path: bin/fsview

  integration:
    # Loop-device tests inside a privileged Debian 13 container.
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Build test binary
        run: |
          mkdir -p web/dist && touch web/dist/.gitkeep
          cargo test --locked --features integration --test integration --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "integration") | .executable' > it-path
          cp "$(cat it-path)" it.test
      - name: Run in privileged container
        run: |
          docker run --rm --privileged -v /dev:/dev -v "$PWD":/src -w /tmp debian:trixie bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends util-linux mount e2fsprogs smartmontools pciutils psmisc gdisk mergerfs fuse3 >/dev/null
            /src/it.test --test-threads=1
          '
