name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build UI
        run: cd web && npm ci && npm run build
      - name: Vet and format
        run: |
          go vet ./...
          go vet -tags integration ./test/integration
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Unit tests
        run: go test -race ./...
      - name: Build binary
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: fsview-linux-amd64
          path: bin/fsview

  integration:
    # Loop-device tests inside a privileged Debian 13 container.
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build test binary
        run: CGO_ENABLED=0 go test -c -tags integration -o it.test ./test/integration
      - name: Run in privileged container
        run: |
          docker run --rm --privileged -v /dev:/dev -v "$PWD":/src -w /tmp debian:trixie bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends util-linux mount e2fsprogs smartmontools pciutils >/dev/null
            /src/it.test -test.v
          '
